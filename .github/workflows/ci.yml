name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pull sandbox images
        run: docker pull -q python:3.12-alpine && docker pull -q eclipse-temurin:21-jdk-alpine
      # Every service's tests, plus SandboxEscapeTest and the content-tests module, which run against the runner's
      # real Docker daemon. No AWS needed: the services' tests stand in for SQS and SNS.
      - run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # The infrastructure compiles to a valid CloudFormation template. No AWS credentials needed.
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deploy/aws/package-lock.json
      - run: npm ci
      - run: npx cdk synth --quiet -c imageTag=ci

  # Deploys main to AWS (docs/DEPLOY_AWS.md). Skipped until the AWS_DEPLOY_ROLE_ARN variable is set.
  deploy:
    needs: [backend, frontend, infrastructure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: deploy/aws/deploy.sh "$GITHUB_SHA"
