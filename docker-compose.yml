services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codecomp
      POSTGRES_USER: codecomp
      POSTGRES_PASSWORD: codecomp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecomp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/codecomp
      DB_USER: codecomp
      DB_PASSWORD: codecomp
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      RUNS_PER_MINUTE: ${RUNS_PER_MINUTE:-20}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
