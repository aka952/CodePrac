# Settings every web service shares. Each service's application.yml imports this file.
server:
  port: ${PORT:8080}
  error.include-message: always
  # behind a load balancer or nginx: build redirect URLs from the forwarded host and scheme
  forward-headers-strategy: framework

spring:
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
  threads.virtual.enabled: true

management.endpoints.web.exposure.include: health

app:
  auth:
    # dev and tests only: trust the X-User-Id header instead of requiring sign-in
    dev-header: ${AUTH_DEV_HEADER:false}
  runs-per-minute: ${RUNS_PER_MINUTE:20}
