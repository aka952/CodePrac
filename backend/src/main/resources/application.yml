spring:
  application.name: codecomp
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/codecomp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
  threads.virtual.enabled: true
  # with virtual threads every thread is a daemon; without this a worker (no web server) would exit right after starting
  main.keep-alive: true

server:
  port: ${PORT:8080}
  error.include-message: always
  # behind nginx/Caddy: build sign-in redirect URLs from the forwarded host and scheme
  forward-headers-strategy: framework
  servlet.session:
    timeout: 14d
    cookie.same-site: lax

management.endpoints.web.exposure.include: health

app:
  # all = API and worker in one process (local development, tests); api = web only; worker = runs the queue only;
  # seed = loads the exercises into the database, then exits (run once per deploy, before api and worker)
  role: ${APP_ROLE:all}
  queue:
    max-queued: ${QUEUE_MAX:500}
    max-active-per-user: ${QUEUE_MAX_PER_USER:2}
  worker:
    threads: ${WORKER_THREADS:${SANDBOX_MAX_CONCURRENT:4}}
    poll-ms: 250
  runs-per-minute: ${RUNS_PER_MINUTE:20}
  warm-on-startup: ${WARM_ON_STARTUP:true}
  review.model: ${REVIEW_MODEL:claude-opus-5-5}
  auth:
    # dev and tests only: trust the X-User-Id header instead of requiring sign-in
    dev-header: ${AUTH_DEV_HEADER:false}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  assistant.model: ${ASSISTANT_MODEL:claude-opus-5-5}

sandbox:
  docker: ${DOCKER_BIN:docker}
  runtime: ${SANDBOX_RUNTIME:}
  cpus: 1.0
  memory-mb: 256
  pids-limit: 64
  tmpfs-mb: 64
  output-limit-bytes: 65536
  max-concurrent: ${SANDBOX_MAX_CONCURRENT:4}
  queue-wait-ms: 3000
  languages:
    python:
      image: ${SANDBOX_PYTHON_IMAGE:python:3.12-alpine}
      file: main.py
      command: exec python3 -I -B /tmp/main.py
      timeout-ms: 5000
    java:
      image: ${SANDBOX_JAVA_IMAGE:eclipse-temurin:21-jdk-alpine}
      file: Main.java
      command: exec java -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:-UsePerfData -Xmx128m -Xss512k /tmp/Main.java
      timeout-ms: 10000
    java-project:
      image: ${SANDBOX_JAVA_IMAGE:eclipse-temurin:21-jdk-alpine}
      file: bundle.b64
      command: base64 -d bundle.b64 > p.zip && unzip -q p.zip -d p && javac -J-XX:TieredStopAtLevel=1 -J-XX:+UseSerialGC -nowarn -d out $(find p -name '*.java') && exec java -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:-UsePerfData -Xmx128m -cp out RepoTests
      timeout-ms: 20000
