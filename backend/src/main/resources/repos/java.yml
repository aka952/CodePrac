        import com.acme.cache.*;
        import java.util.concurrent.CountDownLatch;
        import java.util.concurrent.atomic.AtomicInteger;
        import java.util.concurrent.atomic.AtomicLong;

        public class RepoTests {
            interface Body { void run() throws Exception; }

            static int failed = 0;

            public static void main(String[] args) {
                test("An entry lives for the whole TTL, measured in seconds", () -> {
                    AtomicLong now = new AtomicLong();
                    TtlCache<String, String> cache = new TtlCache<>(10, 60, now::get);
                    cache.put("a", "1");
                    now.addAndGet(59_000);
                    check("1".equals(cache.get("a")), "the entry was gone after 59 seconds of a 60 second TTL");
                });
                test("An entry expires after the TTL", () -> {
                    AtomicLong now = new AtomicLong();
                    TtlCache<String, String> cache = new TtlCache<>(10, 60, now::get);
                    cache.put("a", "1");
                    now.addAndGet(61_000);
                    check(cache.get("a") == null, "the entry was still returned after 61 seconds");
                });
                test("An expired entry is removed when it is looked up", () -> {
                    AtomicLong now = new AtomicLong();
                    TtlCache<String, String> cache = new TtlCache<>(10, 60, now::get);
                    cache.put("a", "1");
                    now.addAndGet(61_000);
                    cache.get("a");
                    check(cache.size() == 0, "size() is still " + cache.size() + " after the expired entry was looked up");
                });
                test("A full cache evicts the least recently used entry", () -> {
                    AtomicLong now = new AtomicLong();
                    TtlCache<String, String> cache = new TtlCache<>(2, 3600, now::get);
                    cache.put("a", "1");
                    now.incrementAndGet();
                    cache.put("b", "2");
                    now.incrementAndGet();
                    cache.get("a");
                    now.incrementAndGet();
                    cache.put("c", "3");
                    check(cache.get("b") == null, "b was least recently used but is still cached");
                    check(cache.get("a") != null && cache.get("c") != null, "a or c was evicted instead of b");
                });
                test("Replacing a key in a full cache evicts nothing", () -> {
                    AtomicLong now = new AtomicLong();
                    TtlCache<String, String> first = new TtlCache<>(2, 3600, now::get);
                    first.put("a", "1");
                    now.incrementAndGet();
                    first.put("b", "2");
                    now.incrementAndGet();
                    first.put("a", "one");
                    check(first.size() == 2 && first.get("b") != null, "replacing a evicted b");

                    TtlCache<String, String> second = new TtlCache<>(2, 3600, now::get);
                    second.put("a", "1");
                    now.incrementAndGet();
                    second.put("b", "2");
                    now.incrementAndGet();
                    second.get("a");
                    now.incrementAndGet();
                    second.put("a", "one");
                    check(second.size() == 2 && second.get("b") != null, "replacing a (after reading it) evicted b");
                    check("one".equals(second.get("a")), "a does not hold the new value");
                });
                test("hitRate() is hits divided by lookups", () -> {
                    AtomicLong now = new AtomicLong();
                    TtlCache<String, String> cache = new TtlCache<>(10, 3600, now::get);
                    check(cache.hitRate() == 0.0, "expected 0.0 before any lookup but got " + cache.hitRate());
                    cache.put("a", "1");
                    cache.get("a");
                    cache.get("a");
                    cache.get("a");
                    cache.get("missing");
                    check(Math.abs(cache.hitRate() - 0.75) < 1e-9, "3 hits and 1 miss: expected 0.75 but got " + cache.hitRate());
                });
                test("getOrLoad() returns the cached value on the second call", () -> {
                    AtomicLong now = new AtomicLong();
                    AtomicInteger loads = new AtomicInteger();
                    TtlCache<String, String> cache = new TtlCache<>(10, 3600, now::get);
                    cache.getOrLoad("a", k -> "v" + loads.incrementAndGet());
                    String again = cache.getOrLoad("a", k -> "v" + loads.incrementAndGet());
                    check("v1".equals(again) && loads.get() == 1, "the loader ran " + loads.get() + " times");
                });
                test("getOrLoad() runs the loader once when threads race for the same key", () -> {
                    AtomicLong now = new AtomicLong();
                    AtomicInteger loads = new AtomicInteger();
                    TtlCache<String, String> cache = new TtlCache<>(10, 3600, now::get);
                    CountDownLatch start = new CountDownLatch(1);
                    Thread[] threads = new Thread[6];
                    for (int i = 0; i < threads.length; i++) {
                        threads[i] = new Thread(() -> {
                            try {
                                start.await();
                            } catch (InterruptedException e) {
                                return;
                            }
                            cache.getOrLoad("price", k -> {
                                loads.incrementAndGet();
                                try {
                                    Thread.sleep(100);
                                } catch (InterruptedException e) {
                                    Thread.currentThread().interrupt();
                                }
                                return "42";
                            });
                        });
                        threads[i].start();
                    }
                    start.countDown();
                    for (Thread t : threads) t.join();
                    check(loads.get() == 1, "the loader ran " + loads.get() + " times for one key");
                });
                test("Concurrent puts lose no entries", () -> {
                    AtomicLong now = new AtomicLong();
                    TtlCache<Integer, Integer> cache = new TtlCache<>(1_000_000, 3600, now::get);
                    Thread[] threads = new Thread[4];
                    for (int i = 0; i < threads.length; i++) {
                        int base = i * 100_000;
                        threads[i] = new Thread(() -> {
                            for (int j = 0; j < 20_000; j++) cache.put(base + j, j);
                        });
                        threads[i].start();
                    }
                    for (Thread t : threads) t.join();
                    check(cache.size() == 80_000, "expected 80000 entries but size() is " + cache.size());
                });
                System.exit(failed == 0 ? 0 : 1);
            }

            static void test(String name, Body body) {
                try {
                    body.run();
                    System.out.println("PASS " + name);
                } catch (Throwable t) {
                    failed++;
                    String why = t instanceof AssertionError && t.getMessage() != null ? t.getMessage() : t.toString();
                    System.out.println("FAIL " + name + ": " + why.replace('\n', ' '));
                }
            }

            static void check(boolean ok, String message) {
                if (!ok) throw new AssertionError(message);
            }
        }
