      content: |
        package com.library;

        import java.util.ArrayList;
        import java.util.List;

        public class Member {
            private final String name;
            private final List<Book> loans = new ArrayList<>();

            public Member(String name) {
                this.name = name;
            }

            public String getName() { return name; }

            public List<Book> getLoans() {
                return loans;
            }
        }
    - path: src/main/java/com/library/LoanService.java
      content: |
        package com.library;

        import java.time.LocalDate;
        import java.util.HashMap;
        import java.util.Map;

        public class LoanService {
            public static final int MAX_LOANS = 3;
            public static final int LOAN_DAYS = 14;
            public static final int FEE_PER_DAY_CENTS = 25;

            private final Map<String, LocalDate> dueDates = new HashMap<>();

            public void borrow(Member member, Book book, LocalDate today) {
                if (member.getLoans().size() > MAX_LOANS) {
                    throw new IllegalStateException("Loan limit reached");
                }
                book.setAvailable(false);
                member.getLoans().add(book);
                dueDates.put(book.getIsbn(), today.plusDays(LOAN_DAYS));
            }

            /** Returns the late fee in cents. */
            public int returnBook(Member member, Book book, LocalDate today) {
                member.getLoans().remove(book);
                LocalDate due = dueDates.get(book.getIsbn());
                int daysLate = today.getDayOfYear() - due.getDayOfYear();
                return daysLate * FEE_PER_DAY_CENTS;
            }
        }
  issues:
    - id: 1
      file: src/main/java/com/library/Book.java
      line: 19
      category: bug
      title: equals() overridden without hashCode()
      detail: >
        Equal objects must have equal hash codes. Without hashCode(), two Book objects with the same ISBN land in
        different hash buckets, so HashSet.contains and HashMap.get fail to find a book that is "equal".
        Add hashCode() based on the same field: return isbn.hashCode().
    - id: 2
      file: src/main/java/com/library/Member.java
      line: 17
      category: design
      title: getLoans() hands out the internal list
      detail: >
        Any caller can add or remove loans directly and bypass the loan limit and availability rules. LoanService
        itself relies on this to modify the list. Return an unmodifiable copy (List.copyOf) and give Member
        package-private addLoan/removeLoan methods for LoanService to use.
    - id: 3
      file: src/main/java/com/library/LoanService.java
      line: 15
      category: bug
      title: Loan limit is off by one
      detail: >
        size() > MAX_LOANS only refuses the fifth book: with 3 loans the check is false and a fourth is allowed.
        The limit check must be size() >= MAX_LOANS.
    - id: 4
      file: src/main/java/com/library/LoanService.java
      line: 18
      category: bug
      title: A book already on loan can be borrowed again
      detail: >
        borrow() never checks book.isAvailable(), so the same copy can be lent to two members at once and the
        first due date is overwritten. Throw IllegalStateException when the book is not available.
    - id: 5
      file: src/main/java/com/library/LoanService.java
      line: 25
      category: bug
      title: Returned books never become available again
      detail: >
        returnBook() removes the loan but does not call book.setAvailable(true) or clear the due date, so the
        book looks permanently on loan. Mark it available and remove its due-date entry.
    - id: 6
      file: src/main/java/com/library/LoanService.java
      line: 26
      category: error-handling
      title: Returning a book that is not on loan crashes
      detail: >
        dueDates.get() returns null for a book that was never borrowed and the next line throws
        NullPointerException. Check that the member actually holds the book and throw an
        IllegalArgumentException otherwise.
    - id: 7
      file: src/main/java/com/library/LoanService.java
      line: 27
      category: bug
      title: Late fee uses day-of-year arithmetic
      detail: >
        Subtracting getDayOfYear() values is wrong across a year boundary (2 January minus 30 December gives -362),
        and an early return gives a negative number of days and therefore a negative fee. Use
        ChronoUnit.DAYS.between(due, today) and clamp it at zero with Math.max.
