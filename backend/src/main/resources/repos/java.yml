    - path: src/main/java/com/library/LoanService.java
      content: |
        package com.library;

        import java.time.LocalDate;
        import java.time.temporal.ChronoUnit;
        import java.util.HashMap;
        import java.util.Map;

        public class LoanService {
            public static final int MAX_LOANS = 3;
            public static final int LOAN_DAYS = 14;
            public static final int FEE_PER_DAY_CENTS = 25;

            private final Map<String, LocalDate> dueDates = new HashMap<>();

            public void borrow(Member member, Book book, LocalDate today) {
                if (!book.isAvailable()) {
                    throw new IllegalStateException("Book is already on loan");
                }
                if (member.getLoans().size() >= MAX_LOANS) {
                    throw new IllegalStateException("Loan limit reached");
                }
                book.setAvailable(false);
                member.addLoan(book);
                dueDates.put(book.getIsbn(), today.plusDays(LOAN_DAYS));
            }

            /** Returns the late fee in cents. */
            public int returnBook(Member member, Book book, LocalDate today) {
                if (!member.getLoans().contains(book)) {
                    throw new IllegalArgumentException("This member has not borrowed " + book.getIsbn());
                }
                member.removeLoan(book);
                book.setAvailable(true);
                LocalDate due = dueDates.remove(book.getIsbn());
                long daysLate = Math.max(0, ChronoUnit.DAYS.between(due, today));
                return (int) daysLate * FEE_PER_DAY_CENTS;
            }
        }

- slug: java-checkout-service
  title: Checkout service
  language: java
  difficulty: medium
  tags: [collections, validation, integer-math, data-integrity]
  description: |
    A tiny checkout module for a web shop. It was written in a hurry and merged without review.

    Intended behaviour:
    - Cart.add(sku, qty) adds qty to whatever is already in the cart. qty must be positive (IllegalArgumentException otherwise).
    - CheckoutService.checkout(cart, coupon) returns the total in cents, takes 10% off for coupon SAVE10, and removes the items from stock.
    - Checkout fails with IllegalArgumentException for an unknown SKU and IllegalStateException when any item has too little stock.
    - A failed checkout must not change any stock.

    Hidden tests call the public constructors and methods (Product, Inventory.add/find, Cart.add, CheckoutService.checkout), so keep those signatures.
  files:
