    - path: src/main/java/com/acme/users/IdGenerator.java
      content: |
        package com.acme.users;

        import java.util.concurrent.atomic.AtomicLong;

        public class IdGenerator {
            private final AtomicLong next = new AtomicLong(1);

            public long nextId() {
                return next.getAndIncrement();
            }
        }
    - path: src/main/java/com/acme/users/UserRepository.java
      content: |
        package com.acme.users;

        import java.util.ArrayList;
        import java.util.List;
        import java.util.Locale;

        public class UserRepository {
            private final List<User> users = new ArrayList<>();

            public synchronized void save(User user) {
                users.add(user);
            }

            public synchronized User findByEmail(String email) {
                String key = normalize(email);
                for (User u : users) {
                    if (normalize(u.getEmail()).equals(key)) {
                        return u;
                    }
                }
                return null;
            }

            public synchronized List<User> findAll() {
                return List.copyOf(users);
            }

            public synchronized int removeInactive() {
                int before = users.size();
                users.removeIf(u -> !u.isActive());
                return before - users.size();
            }

            static String normalize(String email) {
                return email.strip().toLowerCase(Locale.ROOT);
            }
        }
