        public class RepoTests {
            interface Body { void run() throws Exception; }

            static int failed = 0;
            static final ReportService report = new ReportService();

            public static void main(String[] args) {
                test("totalCents() rounds each amount to the nearest cent", () -> {
                    long cents = report.totalCents(sales(0.29, 1.15));
                    check(cents == 144, "0.29 + 1.15: expected 144 but got " + cents);
