        import com.acme.users.*;
        import java.io.ByteArrayOutputStream;
        import java.io.PrintStream;
        import java.util.Set;
        import java.util.concurrent.ConcurrentHashMap;

        public class RepoTests {
            interface Body { void run() throws Exception; }

            static int failed = 0;

            public static void main(String[] args) {
                test("IdGenerator never hands out the same id twice under concurrency", () -> {
                    IdGenerator ids = new IdGenerator();
                    Set<Long> seen = ConcurrentHashMap.newKeySet();
                    Thread[] threads = new Thread[4];
                    for (int i = 0; i < threads.length; i++) {
                        threads[i] = new Thread(() -> {
                            for (int j = 0; j < 50_000; j++) seen.add(ids.nextId());
                        });
                        threads[i].start();
                    }
                    for (Thread t : threads) t.join();
                    check(seen.size() == 200_000, "expected 200000 unique ids but got " + seen.size());
                });
                test("removeInactive() removes every inactive user", () -> {
                    UserRepository repo = new UserRepository();
                    User a = new User(1, "a@x.com", "h");
                    User b = new User(2, "b@x.com", "h");
                    User c = new User(3, "c@x.com", "h");
                    User d = new User(4, "d@x.com", "h");
                    a.setActive(false);
                    c.setActive(false);
                    repo.save(a);
                    repo.save(b);
                    repo.save(c);
                    repo.save(d);
                    int removed = repo.removeInactive();
                    check(removed == 2, "expected 2 removed but got " + removed);
                    check(repo.findByEmail("a@x.com") == null && repo.findByEmail("c@x.com") == null, "inactive users are still stored");
                    check(repo.findByEmail("b@x.com") != null && repo.findByEmail("d@x.com") != null, "active users were removed");
                });
                test("findAll() does not expose the repository's internal list", () -> {
                    UserRepository repo = new UserRepository();
                    repo.save(new User(1, "a@x.com", "h"));
                    try {
                        repo.findAll().clear();
                    } catch (UnsupportedOperationException expected) {
                    }
                    check(repo.findByEmail("a@x.com") != null, "clearing the list from findAll() deleted users from the repository");
                });
                test("A password matches its own hash", () -> {
                    PasswordHasher h = new PasswordHasher();
                    check(h.matches("s3cret-pw", h.hash("s3cret-pw")), "matches(pw, hash(pw)) returned false");
                });
                test("Different passwords never match, even with equal hashCode()", () -> {
                    PasswordHasher h = new PasswordHasher();
                    check(!h.matches("BB", h.hash("Aa")), "\"BB\" matched the hash of \"Aa\"");
                });
                test("Hashes are salted so equal passwords hash differently", () -> {
                    PasswordHasher h = new PasswordHasher();
                    check(!h.hash("same-password").equals(h.hash("same-password")), "two hashes of the same password are identical");
                });
                test("Registering a taken email fails with IllegalArgumentException", () -> {
                    UserService svc = new UserService();
                    svc.register("a@x.com", "password1");
                    expectThrows(IllegalArgumentException.class, () -> svc.register("a@x.com", "password2"), "registering a@x.com twice");
                });
                test("Emails are unique ignoring case", () -> {
                    UserService svc = new UserService();
                    svc.register("Bob@Example.com", "password1");
                    expectThrows(IllegalArgumentException.class, () -> svc.register("bob@example.com", "password2"),
                            "registering bob@example.com after Bob@Example.com");
                });
                test("Passwords never appear in the logs", () -> {
                    PrintStream out = System.out;
                    PrintStream err = System.err;
                    ByteArrayOutputStream captured = new ByteArrayOutputStream();
                    PrintStream capture = new PrintStream(captured, true);
                    System.setOut(capture);
                    System.setErr(capture);
                    try {
                        new UserService().register("carol@x.com", "hunter2-secret");
                    } finally {
                        System.setOut(out);
                        System.setErr(err);
                    }
                    check(!captured.toString().contains("hunter2-secret"), "the password was printed");
                });
                test("Login with an unknown email returns false", () -> {
                    check(!new UserService().login("ghost@x.com", "whatever1"), "login returned true");
                });
                test("Login accepts the right password and rejects a wrong one", () -> {
                    UserService svc = new UserService();
                    svc.register("dave@x.com", "correct-horse");
                    check(svc.login("dave@x.com", "correct-horse"), "login with the right password failed");
                    check(!svc.login("dave@x.com", "wrong-horse"), "login with a wrong password succeeded");
                });
                System.exit(failed == 0 ? 0 : 1);
            }

            static void test(String name, Body body) {
                try {
                    body.run();
                    System.out.println("PASS " + name);
                } catch (Throwable t) {
                    failed++;
                    String why = t instanceof AssertionError && t.getMessage() != null ? t.getMessage() : t.toString();
                    System.out.println("FAIL " + name + ": " + why.replace('\n', ' '));
                }
            }

            static void check(boolean ok, String message) {
                if (!ok) throw new AssertionError(message);
            }

            static void expectThrows(Class<? extends Throwable> type, Body body, String what) {
                try {
                    body.run();
                } catch (Throwable t) {
                    if (type.isInstance(t)) return;
                    throw new AssertionError(what + " should throw " + type.getSimpleName() + " but threw " + t);
                }
                throw new AssertionError(what + " should throw " + type.getSimpleName() + " but threw nothing");
            }
        }
