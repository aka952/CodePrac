        package com.shop;

        import java.util.ArrayList;
        import java.util.List;

        public class Inventory {
            private List<Product> products = new ArrayList<>();

            public void add(Product p) {
                products.add(p);
            }

            public Product find(String sku) {
                for (Product p : products) {
                    if (p.sku == sku) {
                        return p;
                    }
                }
                return null;
            }
        }
