- slug: java-library-loans
  title: Library loans
  language: java
  difficulty: easy
  tags: [equals-hashcode, off-by-one, dates, encapsulation]
  description: |
    The lending desk of a small library. It mostly works when one person tries it once.

    Intended behaviour:
    - Two Book objects with the same ISBN are the same book, including inside a HashSet or HashMap.
    - A member can hold at most 3 books. borrow() fails with IllegalStateException when the member is at the limit or the book is already on loan.
    - Loans are due 14 days after borrowing. returnBook() returns the late fee in cents: 25 per day late, 0 when on time or early.
    - A returned book is available again. Returning a book the member has not borrowed fails with IllegalArgumentException.
    - A member's loans can only change through LoanService.

    Hidden tests call the public constructors and methods (Book, Member, LoanService.borrow/returnBook), so keep those signatures.
  files:
    - path: src/main/java/com/library/Book.java
      content: |
        package com.library;

        public class Book {
            private final String isbn;
            private final String title;
            private boolean available = true;

            public Book(String isbn, String title) {
                this.isbn = isbn;
                this.title = title;
            }

            public String getIsbn() { return isbn; }
            public String getTitle() { return title; }
            public boolean isAvailable() { return available; }
            public void setAvailable(boolean available) { this.available = available; }

            @Override
            public boolean equals(Object o) {
                if (!(o instanceof Book)) return false;
                return isbn.equals(((Book) o).isbn);
            }
        }
