- slug: java-checkout-service
  title: Checkout service
  language: java
  difficulty: medium
  tags: [collections, validation, integer-math, data-integrity]
  description: |
    A tiny checkout module for a web shop. It was written in a hurry and merged without review.

    Intended behaviour:
    - Cart.add(sku, qty) adds qty to whatever is already in the cart. qty must be positive (IllegalArgumentException otherwise).
    - CheckoutService.checkout(cart, coupon) returns the total in cents, takes 10% off for coupon SAVE10, and removes the items from stock.
    - Checkout fails with IllegalArgumentException for an unknown SKU and IllegalStateException when any item has too little stock.
      A failed checkout must not change any stock.

    Hidden tests call the public constructors and methods (Product, Inventory.add/find, Cart.add, CheckoutService.checkout), so keep those signatures.
  files:
    - path: src/main/java/com/shop/Product.java
      content: |
        package com.shop;

        public class Product {
            public String sku;
            public String name;
            public long priceCents;
            public int stock;

            public Product(String sku, String name, long priceCents, int stock) {
                this.sku = sku;
                this.name = name;
                this.priceCents = priceCents;
                this.stock = stock;
            }
        }
    - path: src/main/java/com/shop/Inventory.java
      content: |
        package com.shop;

        import java.util.ArrayList;
        import java.util.List;

        public class Inventory {
            private List<Product> products = new ArrayList<>();

            public void add(Product p) {
                products.add(p);
            }

            public Product find(String sku) {
                for (Product p : products) {
                    if (p.sku == sku) {
                        return p;
                    }
                }
                return null;
            }
        }
    - path: src/main/java/com/shop/Cart.java
      content: |
        package com.shop;

        import java.util.HashMap;
        import java.util.Map;

        public class Cart {
            public Map<String, Integer> items = new HashMap<>();

            public void add(String sku, int qty) {
                items.put(sku, qty);
            }
        }
    - path: src/main/java/com/shop/CheckoutService.java
      content: |
        package com.shop;

        public class CheckoutService {
            private Inventory inventory;

            public CheckoutService(Inventory inventory) {
                this.inventory = inventory;
            }

            /** Returns the total in cents after any coupon, and takes the items out of stock. */
            public long checkout(Cart cart, String coupon) {
                long total = 0;
                for (String sku : cart.items.keySet()) {
                    int qty = cart.items.get(sku);
                    Product p = inventory.find(sku);
                    p.stock = p.stock - qty;
                    total += p.priceCents * qty;
                }
                if (coupon != null && coupon.equals("SAVE10")) {
                    total = total - total * (10 / 100);
                }
                return total;
            }
        }
  issues:
    - id: 1
      file: src/main/java/com/shop/Inventory.java
      line: 15
      category: bug
      title: SKUs compared with ==
      detail: >
        == compares object identity, not string contents. It only works when both strings happen to be the same
        interned literal; a SKU read from a request or built at runtime will never match. Use sku.equals(p.sku),
        or better, store products in a Map<String, Product> keyed by SKU, which also removes the linear scan.
    - id: 2
      file: src/main/java/com/shop/Cart.java
      line: 10
      category: bug
      title: add() overwrites the quantity instead of adding to it
      detail: >
        items.put replaces the previous quantity, so adding 2 then 3 of the same SKU leaves 3 in the cart.
        Use items.merge(sku, qty, Integer::sum).
    - id: 3
      file: src/main/java/com/shop/Cart.java
      line: 9
      category: validation
      title: Quantity is not validated
      detail: >
        Zero or negative quantities are accepted, which can produce negative totals and increase stock at checkout.
        Reject qty <= 0 with an IllegalArgumentException.
    - id: 4
      file: src/main/java/com/shop/CheckoutService.java
      line: 20
      category: bug
      title: Coupon discount is always zero
      detail: >
        10 / 100 is integer division and evaluates to 0, so SAVE10 never discounts anything.
        Compute total * 10 / 100 (multiply first) or total - total / 10, and decide on rounding explicitly.
    - id: 5
      file: src/main/java/com/shop/CheckoutService.java
      line: 16
      category: data-integrity
      title: Stock is never checked and is reduced item by item
      detail: >
        Stock is decremented without checking availability, so it can go negative. Because it is decremented
        inside the loop, a failure on a later item would leave earlier items already taken out of stock.
        Validate every line first (existence and stock), and only then apply all the decrements.
    - id: 6
      file: src/main/java/com/shop/CheckoutService.java
      line: 15
      category: error-handling
      title: Unknown SKU crashes with NullPointerException
      detail: >
        find() returns null for an unknown SKU and the next line dereferences it. Check for null (or return Optional)
        and throw an IllegalArgumentException that names the SKU.
    - id: 7
      file: src/main/java/com/shop/Cart.java
      line: 7
      category: design
      title: Mutable state exposed through public fields
      detail: >
        Cart.items and all of Product's fields are public and mutable, so any caller can bypass validation
        (put a negative quantity straight into the map, or set stock directly). Make the fields private and expose
        read-only views or intention-revealing methods instead.
