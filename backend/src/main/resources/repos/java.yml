    - path: src/main/java/com/acme/cache/TtlCache.java
      content: |
        package com.acme.cache;

        import java.util.HashMap;
        import java.util.Map;
        import java.util.function.Function;
        import java.util.function.LongSupplier;

        /** Every public method holds the cache's lock, so compound operations such as getOrLoad are atomic. */
        public class TtlCache<K, V> {
            private final Map<K, CacheEntry<V>> entries = new HashMap<>();
            private final int maxSize;
            private final long ttlMillis;
            private final LongSupplier clock;
            private long hits;
            private long misses;

            public TtlCache(int maxSize, long ttlSeconds, LongSupplier clock) {
                this.maxSize = maxSize;
                this.ttlMillis = ttlSeconds * 1000;
                this.clock = clock;
            }

            public synchronized V get(K key) {
                long now = clock.getAsLong();
                CacheEntry<V> entry = entries.get(key);
                if (entry != null && now - entry.createdAt > ttlMillis) {
                    entries.remove(key);
                    entry = null;
                }
                if (entry == null) {
                    misses++;
                    return null;
                }
                hits++;
                entry.lastAccess = now;
                return entry.value;
            }

            public synchronized void put(K key, V value) {
                if (!entries.containsKey(key) && entries.size() >= maxSize) {
                    evictOne();
                }
                entries.put(key, new CacheEntry<>(value, clock.getAsLong()));
            }

            public synchronized V getOrLoad(K key, Function<K, V> loader) {
                V value = get(key);
                if (value == null) {
                    value = loader.apply(key);
                    put(key, value);
                }
                return value;
            }

            private void evictOne() {
                K victim = null;
                long oldest = Long.MAX_VALUE;
                for (Map.Entry<K, CacheEntry<V>> e : entries.entrySet()) {
                    if (e.getValue().lastAccess < oldest) {
                        oldest = e.getValue().lastAccess;
                        victim = e.getKey();
                    }
                }
                entries.remove(victim);
            }

            public synchronized int size() {
                return entries.size();
            }

            public synchronized double hitRate() {
                long lookups = hits + misses;
                return lookups == 0 ? 0.0 : (double) hits / lookups;
            }
        }
