                    big.add(new Sale("b", 1, 2_000_000_000));
                    long total = report.totalQuantity(big);
                    check(total == 4_000_000_000L, "expected 4000000000 but got " + total);
                });
                test("topSales() orders by amount, including the cents", () -> {
                    List<Sale> top = report.topSales(sales(10.2, 10.9, 10.5), 2);
                    check(amounts(top).equals("10.9 10.5"), "expected 10.9 10.5 but got " + amounts(top));
                });
                test("topSales() leaves the caller's list unchanged", () -> {
                    List<Sale> mine = sales(1, 30, 20);
                    report.topSales(mine, 2);
                    check(amounts(mine).equals("1.0 30.0 20.0"), "the list passed in is now " + amounts(mine));
                });
                test("topSales() with n larger than the list returns every sale", () -> {
                    List<Sale> top = report.topSales(sales(1, 3, 2), 10);
                    check(amounts(top).equals("3.0 2.0 1.0"), "expected 3.0 2.0 1.0 but got " + amounts(top));
                });
                test("page() numbers pages from 1", () -> {
                    List<Sale> first = report.page(sales(1, 2, 3, 4, 5), 1, 2);
                    check(amounts(first).equals("1.0 2.0"), "page 1 of size 2: expected 1.0 2.0 but got " + amounts(first));
                });
                test("page() returns a short last page and an empty page past the end", () -> {
                    List<Sale> last = report.page(sales(1, 2, 3, 4, 5), 3, 2);
                    check(amounts(last).equals("5.0"), "page 3 of size 2: expected 5.0 but got " + amounts(last));
                    List<Sale> beyond = report.page(sales(1, 2, 3, 4, 5), 4, 2);
                    check(beyond.isEmpty(), "page 4 of size 2 should be empty but has " + beyond.size() + " sales");
                });
                test("toCsv() writes a header and one line per sale", () -> {
                    List<Sale> two = new ArrayList<>();
                    two.add(new Sale("Bob", 1, 1));
                    two.add(new Sale("Eve", 2.5, 3));
                    String csv = report.toCsv(two);
                    check(csv.equals("customer,amount,quantity\nBob,1.00,1\nEve,2.50,3\n"), "got " + show(csv));
                });
                test("toCsv() quotes names containing a comma or a quote", () -> {
                    List<Sale> tricky = new ArrayList<>();
                    tricky.add(new Sale("Smith, John", 10, 1));
                    tricky.add(new Sale("Ann \"AJ\" Lee", 2.5, 3));
                    String csv = report.toCsv(tricky);
                    String expected = "customer,amount,quantity\n\"Smith, John\",10.00,1\n\"Ann \"\"AJ\"\" Lee\",2.50,3\n";
                    check(csv.equals(expected), "expected " + show(expected) + " but got " + show(csv));
                });
                System.exit(failed == 0 ? 0 : 1);
            }

            static List<Sale> sales(double... amounts) {
                List<Sale> list = new ArrayList<>();
                for (double a : amounts) list.add(new Sale("c" + list.size(), a, 1));
                return list;
            }

            static String amounts(List<Sale> sales) {
                StringBuilder sb = new StringBuilder();
                for (Sale s : sales) sb.append(sb.length() == 0 ? "" : " ").append(s.getAmount());
                return sb.toString();
            }

            static String show(String s) {
                return s.replace("\n", "\\n");
            }

            static void test(String name, Body body) {
                try {
                    body.run();
                    System.out.println("PASS " + name);
                } catch (Throwable t) {
                    failed++;
                    String why = t instanceof AssertionError && t.getMessage() != null ? t.getMessage() : t.toString();
                    System.out.println("FAIL " + name + ": " + why.replace('\n', ' '));
                }
            }

            static void check(boolean ok, String message) {
                if (!ok) throw new AssertionError(message);
            }
        }
  solution:
    - path: src/main/java/com/acme/report/ReportService.java
      content: |
        package com.acme.report;

        import java.util.ArrayList;
        import java.util.Comparator;
        import java.util.List;
        import java.util.Locale;

        public class ReportService {

            /** Total of all sale amounts, in cents. */
            public long totalCents(List<Sale> sales) {
                long cents = 0;
                for (Sale s : sales) {
                    cents += Math.round(s.getAmount() * 100);
                }
                return cents;
            }

            public double averageAmount(List<Sale> sales) {
                if (sales.isEmpty()) return 0;
                double sum = 0;
                for (Sale s : sales) {
                    sum += s.getAmount();
                }
                return sum / sales.size();
            }

            public long totalQuantity(List<Sale> sales) {
                long total = 0;
                for (Sale s : sales) {
                    total += s.getQuantity();
                }
                return total;
            }

            /** The n largest sales, biggest first. */
            public List<Sale> topSales(List<Sale> sales, int n) {
                List<Sale> sorted = new ArrayList<>(sales);
                sorted.sort(Comparator.comparingDouble(Sale::getAmount).reversed());
                return new ArrayList<>(sorted.subList(0, Math.max(0, Math.min(n, sorted.size()))));
            }

            /** One page of sales. Pages are numbered from 1. */
            public List<Sale> page(List<Sale> sales, int page, int size) {
                long from = (long) (page - 1) * size;
                if (from < 0 || from >= sales.size()) return new ArrayList<>();
                int to = (int) Math.min(from + size, sales.size());
                return new ArrayList<>(sales.subList((int) from, to));
            }

            public String toCsv(List<Sale> sales) {
                StringBuilder csv = new StringBuilder("customer,amount,quantity\n");
                for (Sale s : sales) {
                    csv.append(escape(s.getCustomer())).append(',')
                            .append(String.format(Locale.ROOT, "%.2f", s.getAmount())).append(',')
                            .append(s.getQuantity()).append('\n');
                }
                return csv.toString();
            }

            private static String escape(String field) {
                if (!field.contains(",") && !field.contains("\"") && !field.contains("\n") && !field.contains("\r")) return field;
                return "\"" + field.replace("\"", "\"\"") + "\"";
            }
        }

- slug: java-user-registry
  title: User registry
  language: java
  difficulty: hard
  tags: [security, concurrency, collections, error-handling]
  description: |
    The user registration module of a small web app. Several request threads call it at the same time.

    Intended behaviour:
    - register(email, password) creates a user. Emails are unique ignoring case; a duplicate or a password shorter than 6 characters fails with IllegalArgumentException.
    - login(email, password) returns true only for the right password, and false (never an exception) for an unknown email.
    - Passwords are stored with a salted, slow password hash (for example PBKDF2 from javax.crypto) and never written to logs.
    - Ids are unique even under concurrent use. removeInactive() deletes every inactive user and returns how many it removed.

    Hidden tests call the public constructors and methods of every class, so keep those signatures.
