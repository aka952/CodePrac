    - path: src/main/java/com/acme/report/ReportService.java
      content: |
        package com.acme.report;

        import java.util.Collections;
        import java.util.Comparator;
        import java.util.List;
        import java.util.Locale;

        public class ReportService {

            /** Total of all sale amounts, in cents. */
            public long totalCents(List<Sale> sales) {
                long cents = 0;
                for (Sale s : sales) {
                    cents += (long) (s.getAmount() * 100);
                }
                return cents;
            }

            public double averageAmount(List<Sale> sales) {
                double sum = 0;
                for (Sale s : sales) {
                    sum += s.getAmount();
                }
                return sum / sales.size();
            }

            public long totalQuantity(List<Sale> sales) {
                int total = 0;
                for (Sale s : sales) {
                    total += s.getQuantity();
                }
                return total;
            }

            /** The n largest sales, biggest first. */
            public List<Sale> topSales(List<Sale> sales, int n) {
                Comparator<Sale> biggestFirst = (a, b) -> (int) (b.getAmount() - a.getAmount());
                Collections.sort(sales, biggestFirst);
                return sales.subList(0, n);
            }

            /** One page of sales. Pages are numbered from 1. */
            public List<Sale> page(List<Sale> sales, int page, int size) {
                int from = page * size;
                return sales.subList(from, from + size);
            }

            public String toCsv(List<Sale> sales) {
                String csv = "customer,amount,quantity\n";
                for (Sale s : sales) {
                    csv += s.getCustomer() + "," + String.format(Locale.ROOT, "%.2f", s.getAmount()) + "," + s.getQuantity() + "\n";
                }
                return csv;
            }
        }
