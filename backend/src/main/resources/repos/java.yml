    - id: 1
      file: src/main/java/com/acme/report/ReportService.java
      line: 14
      category: bug
      title: Cents are truncated, not rounded
      detail: >
        Amounts are doubles, and most decimal fractions have no exact binary form: 0.29 * 100 is 28.999999999999996,
        and the (long) cast cuts it to 28. Every such sale loses a cent. Use Math.round(amount * 100), and better,
        stop holding money in double at all: store cents in a long or use BigDecimal.
    - id: 2
      file: src/main/java/com/acme/report/ReportService.java
      line: 24
      category: bug
      title: Average of an empty list is NaN
      detail: >
        With no sales, sum / sales.size() is 0.0 / 0, which is NaN in floating point (no exception is thrown).
        NaN then spreads through every later calculation and prints as "NaN" on the dashboard. Return 0 when the
        list is empty.
    - id: 3
      file: src/main/java/com/acme/report/ReportService.java
      line: 28
      category: bug
      title: Quantity total overflows int
      detail: >
        The method returns long but adds up in an int, so the sum silently wraps around past 2,147,483,647 before
        it is widened. Declare the accumulator as long.
    - id: 4
      file: src/main/java/com/acme/report/ReportService.java
      line: 37
      category: bug
      title: Comparator casts the difference to int
      detail: >
        (int) (b - a) turns any difference smaller than 1 into 0, so 10.9 and 10.2 compare as equal and stay in
        their original order; very large differences overflow the int as well. Use
        Comparator.comparingDouble(Sale::getAmount).reversed() or Double.compare(b.getAmount(), a.getAmount()).
    - id: 5
      file: src/main/java/com/acme/report/ReportService.java
      line: 38
      category: design
      title: topSales() reorders the caller's list
      detail: >
        Collections.sort sorts the list that was passed in, so a call that looks like a query changes the order
        the caller sees afterwards (and throws for an immutable list). subList also returns a view of that same
        list. Sort a copy and return a new list.
    - id: 6
      file: src/main/java/com/acme/report/ReportService.java
      line: 44
      category: bug
      title: page() skips the first page
      detail: >
        Pages are numbered from 1, but from = page * size treats them as numbered from 0, so page 1 returns the
        second page and the first page can never be requested. The start index is (page - 1) * size.
    - id: 7
      file: src/main/java/com/acme/report/ReportService.java
      line: 45
      category: bug
      title: subList end is not clamped to the list size
      detail: >
        from + size runs past the end on a short last page or a page beyond the data, and subList throws
        IndexOutOfBoundsException. Clamp the end with Math.min(from + size, sales.size()) and return an empty list
        when from is past the end. topSales() has the same problem when n is larger than the list.
    - id: 8
      file: src/main/java/com/acme/report/ReportService.java
      line: 51
      category: bug
      title: CSV fields are not escaped
      detail: >
        A customer called "Smith, John" produces a row with four columns, and a quote or line break in a name
        breaks the file. Wrap a field in double quotes when it contains a comma, quote or line break, and double
        any quotes inside it.
    - id: 9
      file: src/main/java/com/acme/report/ReportService.java
      line: 51
      category: performance
      title: String concatenation in a loop
      detail: >
        csv += ... copies the whole string built so far on every iteration, which is quadratic in the number of
        rows and slow for a large export. Append to a StringBuilder.
