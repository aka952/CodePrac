        package com.acme.users;

        import java.util.ArrayList;
        import java.util.List;
        import java.util.Locale;

        public class UserRepository {
            private final List<User> users = new ArrayList<>();

            public synchronized void save(User user) {
                users.add(user);
            }

            public synchronized User findByEmail(String email) {
                String key = normalize(email);
                for (User u : users) {
                    if (normalize(u.getEmail()).equals(key)) {
                        return u;
                    }
                }
                return null;
            }

            public synchronized List<User> findAll() {
                return List.copyOf(users);
            }

            public synchronized int removeInactive() {
                int before = users.size();
                users.removeIf(u -> !u.isActive());
                return before - users.size();
            }

            static String normalize(String email) {
                return email.strip().toLowerCase(Locale.ROOT);
            }
        }
    - path: src/main/java/com/acme/users/PasswordHasher.java
      content: |
        package com.acme.users;

        import java.security.GeneralSecurityException;
        import java.security.MessageDigest;
        import java.security.SecureRandom;
        import java.util.Base64;
        import javax.crypto.SecretKeyFactory;
        import javax.crypto.spec.PBEKeySpec;

        public class PasswordHasher {
            private static final int ITERATIONS = 120_000;
            private static final SecureRandom RANDOM = new SecureRandom();

            public String hash(String password) {
                byte[] salt = new byte[16];
                RANDOM.nextBytes(salt);
                return encode(salt) + ":" + encode(derive(password, salt));
            }

            public boolean matches(String password, String hash) {
                String[] parts = hash.split(":");
                if (parts.length != 2) return false;
                byte[] expected = Base64.getDecoder().decode(parts[1]);
                return MessageDigest.isEqual(expected, derive(password, Base64.getDecoder().decode(parts[0])));
            }

            private static byte[] derive(String password, byte[] salt) {
                try {
                    var spec = new PBEKeySpec(password.toCharArray(), salt, ITERATIONS, 256);
                    return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).getEncoded();
                } catch (GeneralSecurityException e) {
                    throw new IllegalStateException(e);
                }
            }

            private static String encode(byte[] bytes) {
                return Base64.getEncoder().encodeToString(bytes);
            }
        }
    - path: src/main/java/com/acme/users/UserService.java
      content: |
        package com.acme.users;

        public class UserService {
            private final UserRepository repo = new UserRepository();
            private final IdGenerator ids = new IdGenerator();
            private final PasswordHasher hasher = new PasswordHasher();

            public User register(String email, String password) {
                if (password == null || password.length() < 6) {
                    throw new IllegalArgumentException("Password too short");
                }
                String hash = hasher.hash(password);
                synchronized (repo) {
                    if (repo.findByEmail(email) != null) {
                        throw new IllegalArgumentException("Email already registered");
                    }
                    User user = new User(ids.nextId(), UserRepository.normalize(email), hash);
                    repo.save(user);
                    System.out.println("Registered user " + user.getId());
                    return user;
                }
            }

            public boolean login(String email, String password) {
                User u = repo.findByEmail(email);
                return u != null && hasher.matches(password, u.getPasswordHash());
            }

            public UserRepository repository() {
                return repo;
            }
        }

- slug: java-ttl-cache
  title: TTL cache
  language: java
  difficulty: hard
  tags: [concurrency, caching, units, eviction]
  description: |
    An in-memory cache that sits in front of a slow pricing service. One instance is shared by every request thread.

    Intended behaviour:
    - new TtlCache(maxSize, ttlSeconds, clock): clock supplies the current time in milliseconds.
    - get(key) returns the value, or null when the key is absent or older than ttlSeconds. An expired entry is removed when it is looked up.
    - put(key, value) adds or replaces an entry. Adding a new key to a full cache first evicts the least recently used entry (the one whose last get or put is oldest). Replacing an existing key evicts nothing.
    - getOrLoad(key, loader) returns the cached value, or calls the loader, stores the result and returns it. When several threads ask for the same missing key at once, the loader runs once.
    - hitRate() is the fraction of get() lookups that found a live entry, and 0.0 before any lookup.

    Hidden tests call the public constructor and methods of TtlCache, so keep those signatures.
