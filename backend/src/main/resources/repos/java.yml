    - path: RepoTests.java
      content: |
        import com.library.*;
        import java.time.LocalDate;
        import java.util.HashSet;
        import java.util.Set;

        public class RepoTests {
            interface Body { void run() throws Exception; }

            static int failed = 0;
            static final LocalDate MARCH_1 = LocalDate.of(2026, 3, 1);

            public static void main(String[] args) {
                test("Books with the same ISBN are the same book in a HashSet", () -> {
                    Set<Book> shelf = new HashSet<>();
                    shelf.add(new Book("111", "Dune"));
                    check(shelf.contains(new Book("111", "Dune")), "HashSet.contains() did not find an equal book");
                });
                test("A member can borrow three books", () -> {
                    LoanService desk = new LoanService();
                    Member ann = new Member("Ann");
                    for (int i = 1; i <= 3; i++) desk.borrow(ann, new Book("isbn-" + i, "Book " + i), MARCH_1);
                    check(ann.getLoans().size() == 3, "expected 3 loans but got " + ann.getLoans().size());
                });
                test("A fourth loan is refused", () -> {
                    LoanService desk = new LoanService();
                    Member ann = new Member("Ann");
                    for (int i = 1; i <= 3; i++) desk.borrow(ann, new Book("isbn-" + i, "Book " + i), MARCH_1);
                    expectThrows(IllegalStateException.class, () -> desk.borrow(ann, new Book("isbn-4", "Book 4"), MARCH_1), "a fourth borrow");
                    check(ann.getLoans().size() == 3, "expected 3 loans but got " + ann.getLoans().size());
                });
                test("A book on loan cannot be borrowed by someone else", () -> {
                    LoanService desk = new LoanService();
                    Book dune = new Book("111", "Dune");
                    desk.borrow(new Member("Ann"), dune, MARCH_1);
                    expectThrows(IllegalStateException.class, () -> desk.borrow(new Member("Bob"), dune, MARCH_1), "borrowing a book that is on loan");
                });
                test("A returned book is available again", () -> {
                    LoanService desk = new LoanService();
                    Member ann = new Member("Ann");
                    Book dune = new Book("111", "Dune");
                    desk.borrow(ann, dune, MARCH_1);
                    desk.returnBook(ann, dune, MARCH_1.plusDays(2));
                    check(dune.isAvailable(), "the book is still marked as on loan");
                    check(ann.getLoans().isEmpty(), "the member still holds the book");
                    desk.borrow(new Member("Bob"), dune, MARCH_1.plusDays(3));
                });
                test("Returning on time or early costs nothing", () -> {
                    LoanService desk = new LoanService();
                    Member ann = new Member("Ann");
                    Book early = new Book("111", "Dune");
                    Book onTime = new Book("222", "Emma");
                    desk.borrow(ann, early, MARCH_1);
                    desk.borrow(ann, onTime, MARCH_1);
                    int earlyFee = desk.returnBook(ann, early, MARCH_1.plusDays(9));
                    int onTimeFee = desk.returnBook(ann, onTime, MARCH_1.plusDays(14));
                    check(earlyFee == 0, "early return: expected fee 0 but got " + earlyFee);
                    check(onTimeFee == 0, "return on the due date: expected fee 0 but got " + onTimeFee);
                });
                test("The late fee is 25 cents per day late", () -> {
                    LoanService desk = new LoanService();
                    Member ann = new Member("Ann");
                    Book dune = new Book("111", "Dune");
                    desk.borrow(ann, dune, MARCH_1);
                    int fee = desk.returnBook(ann, dune, MARCH_1.plusDays(17));
                    check(fee == 75, "3 days late: expected 75 but got " + fee);
                });
                test("Late fees are right across New Year", () -> {
                    LoanService desk = new LoanService();
                    Member ann = new Member("Ann");
                    Book dune = new Book("111", "Dune");
                    desk.borrow(ann, dune, LocalDate.of(2025, 12, 16));
                    int fee = desk.returnBook(ann, dune, LocalDate.of(2026, 1, 2));
                    check(fee == 75, "due 30 Dec, returned 2 Jan: expected 75 but got " + fee);
                });
                test("Returning a book that is not on loan is rejected", () -> {
                    LoanService desk = new LoanService();
                    expectThrows(IllegalArgumentException.class, () -> desk.returnBook(new Member("Ann"), new Book("111", "Dune"), MARCH_1),
                            "returning a book that was never borrowed");
                });
                test("getLoans() cannot be used to bypass the loan rules", () -> {
                    Member ann = new Member("Ann");
                    try {
                        ann.getLoans().add(new Book("111", "Dune"));
                    } catch (UnsupportedOperationException expected) {
                    }
                    check(ann.getLoans().isEmpty(), "adding to the list from getLoans() gave the member a loan");
                });
                System.exit(failed == 0 ? 0 : 1);
            }

            static void test(String name, Body body) {
                try {
                    body.run();
                    System.out.println("PASS " + name);
                } catch (Throwable t) {
                    failed++;
                    String why = t instanceof AssertionError && t.getMessage() != null ? t.getMessage() : t.toString();
                    System.out.println("FAIL " + name + ": " + why.replace('\n', ' '));
                }
            }

            static void check(boolean ok, String message) {
                if (!ok) throw new AssertionError(message);
            }

            static void expectThrows(Class<? extends Throwable> type, Body body, String what) {
                try {
                    body.run();
                } catch (Throwable t) {
                    if (type.isInstance(t)) return;
                    throw new AssertionError(what + " should throw " + type.getSimpleName() + " but threw " + t);
                }
                throw new AssertionError(what + " should throw " + type.getSimpleName() + " but threw nothing");
            }
        }
