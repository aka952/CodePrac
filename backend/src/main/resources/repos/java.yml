    - path: src/main/java/com/acme/cache/TtlCache.java
      content: |
        package com.acme.cache;

        import java.util.HashMap;
        import java.util.Map;
        import java.util.function.Function;
        import java.util.function.LongSupplier;

        public class TtlCache<K, V> {
            private final Map<K, CacheEntry<V>> entries = new HashMap<>();
            private final int maxSize;
            private final long ttlSeconds;
            private final LongSupplier clock;
            private int hits;
            private int misses;

            public TtlCache(int maxSize, long ttlSeconds, LongSupplier clock) {
                this.maxSize = maxSize;
                this.ttlSeconds = ttlSeconds;
                this.clock = clock;
            }

            public V get(K key) {
                CacheEntry<V> entry = entries.get(key);
                if (entry == null) {
                    misses++;
                    return null;
                }
                if (clock.getAsLong() - entry.createdAt > ttlSeconds) {
                    misses++;
                    return null;
                }
                hits++;
                entry.lastAccess = clock.getAsLong();
                return entry.value;
            }

            public void put(K key, V value) {
                if (entries.size() >= maxSize) {
                    evictOne();
                }
                entries.put(key, new CacheEntry<>(value, clock.getAsLong()));
            }

            public V getOrLoad(K key, Function<K, V> loader) {
                V value = get(key);
                if (value == null) {
                    value = loader.apply(key);
                    put(key, value);
                }
                return value;
            }

            private void evictOne() {
                K victim = null;
                long latest = Long.MIN_VALUE;
                for (Map.Entry<K, CacheEntry<V>> e : entries.entrySet()) {
                    if (e.getValue().lastAccess > latest) {
                        latest = e.getValue().lastAccess;
                        victim = e.getKey();
                    }
                }
                entries.remove(victim);
            }

            public int size() {
                return entries.size();
            }

            public double hitRate() {
                return hits / (hits + misses);
            }
        }
  issues:
    - id: 1
      file: src/main/java/com/acme/cache/TtlCache.java
      line: 9
      category: concurrency
      title: Shared state is not thread-safe
      detail: >
        The cache is shared by request threads but uses a plain HashMap and plain int counters. Concurrent puts can
        lose entries or corrupt the map during a resize, and hits++ / misses++ lose updates. Guard every public
        method with one lock (synchronized), or use ConcurrentHashMap with atomic counters and make the compound
        operations atomic.
    - id: 2
      file: src/main/java/com/acme/cache/TtlCache.java
      line: 28
      category: bug
      title: TTL in seconds is compared with milliseconds
      detail: >
        The clock returns milliseconds but the age is compared directly with ttlSeconds, so a 60-second TTL expires
        entries after 60 milliseconds. Compare against ttlSeconds * 1000 (or TimeUnit.SECONDS.toMillis), and put the
        unit in the field name.
    - id: 3
      file: src/main/java/com/acme/cache/TtlCache.java
      line: 30
      category: resource-leak
      title: Expired entries are never removed
      detail: >
        An expired entry is reported as a miss but stays in the map. It still counts toward size() and maxSize, so
        dead entries can push live ones out, and keys that are never written again are kept forever. Remove the entry
        when it is found to be expired.
    - id: 4
      file: src/main/java/com/acme/cache/TtlCache.java
      line: 38
      category: bug
      title: Replacing an existing key evicts another entry
      detail: >
        put() evicts whenever the cache is full, even when the key is already present and the map will not grow.
        Updating a value in a full cache therefore throws away an unrelated entry. Only evict when the key is new:
        check !entries.containsKey(key) as well.
    - id: 5
      file: src/main/java/com/acme/cache/TtlCache.java
      line: 47
      category: concurrency
      title: getOrLoad() is a check-then-act race
      detail: >
        get, load and put are three separate steps. Threads that miss at the same moment all call the slow loader
        for the same key (a cache stampede), and the last put wins. Make the whole operation atomic, for example by
        synchronizing it or using ConcurrentHashMap.computeIfAbsent, ideally with per-key locking so one slow load
        does not block other keys.
    - id: 6
      file: src/main/java/com/acme/cache/TtlCache.java
      line: 57
      category: bug
      title: Eviction removes the most recently used entry
      detail: >
        The loop keeps the entry with the largest lastAccess, which is the most recently used one, so the cache
        throws away exactly the entries most likely to be needed again. Track the smallest lastAccess instead
        (start from Long.MAX_VALUE and compare with <), or use an access-ordered LinkedHashMap.
    - id: 7
      file: src/main/java/com/acme/cache/TtlCache.java
      line: 70
      category: bug
      title: hitRate() uses integer division
      detail: >
        hits / (hits + misses) divides two ints, so the result is 0 unless every lookup was a hit, and it throws
        ArithmeticException before the first lookup. Return 0.0 when there were no lookups and otherwise cast to
        double before dividing.
