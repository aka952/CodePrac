  description: |
    The reporting module behind a sales dashboard. The numbers looked right in the demo.

    Intended behaviour:
    - totalCents(sales): the sum of all amounts in cents, each amount rounded to the nearest cent.
    - averageAmount(sales): the mean amount, and 0 for an empty list.
    - totalQuantity(sales): the sum of all quantities. It can be larger than an int.
    - topSales(sales, n): up to n sales with the largest amounts, biggest first. The list passed in is not modified.
    - page(sales, page, size): one page of the list. Pages are numbered from 1, the last page may be shorter, and a page past the end is empty.
    - toCsv(sales): a header line, then one line per sale. A customer name containing a comma or a double quote is wrapped in double quotes, with any quotes inside it doubled.

    Hidden tests call the public constructors and methods of Sale and ReportService, so keep those signatures.
  files:
    - path: src/main/java/com/acme/report/Sale.java
      content: |
        package com.acme.report;

        public class Sale {
            private final String customer;
            private final double amount;
            private final int quantity;

            public Sale(String customer, double amount, int quantity) {
                this.customer = customer;
                this.amount = amount;
                this.quantity = quantity;
            }

            public String getCustomer() { return customer; }
            public double getAmount() { return amount; }
            public int getQuantity() { return quantity; }
