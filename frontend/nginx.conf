# Local stand-in for the AWS load balancer: the same path rules send each /api prefix to its service.
# On AWS, CloudFront serves these files from S3 and sends /api/* to the ALB, which does this routing.

# Keep the public host and scheme when another proxy is in front, so identity-service builds correct sign-in redirect URLs.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

# resolve service names at request time, so nginx starts even while a service is down
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    proxy_read_timeout 60s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    set $identity http://identity:8080;
    set $exercise http://exercise:8080;
    set $repo     http://repo:8080;
    set $run      http://run:8080;

    location /api/auth/          { proxy_pass $identity; }
    location /api/exercises      { proxy_pass $exercise; }
    location /api/points/snippets { proxy_pass $exercise; }
    location /api/repos          { proxy_pass $repo; }
    location /api/edits          { proxy_pass $repo; }
    location /api/points/repos   { proxy_pass $repo; }
    location /api/runs           { proxy_pass $run; }
    location /api/jobs/          { proxy_pass $run; }
    location /api/languages      { proxy_pass $run; }
    # anything else under /api, including the services' /internal endpoints, is not public
    location /api/               { return 404; }
    location /internal/          { return 404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
